<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星枢 · 超分</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" id="bg"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div></div>

<div class="app">
  <!-- 顶栏 -->
  <header class="topbar glass">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 2 L27 21 L46 24 L27 27 L24 46 L21 27 L2 24 L21 21 Z" fill="currentColor"/><path d="M24 10 L25.4 22.6 L38 24 L25.4 25.4 L24 38 L22.6 25.4 L10 24 L22.6 22.6 Z" fill="currentColor" opacity=".55" transform="rotate(45 24 24)"/></svg>
      <div>
        <div class="brand-title"><b>星枢</b> 超分</div>
        <div class="brand-sub">STELLAR UPSCALE · 视频超分</div>
      </div>
    </div>
    <div class="divider"></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-filter="all">全部 <span class="count" id="c-all">0</span></button>
      <button class="tab" data-filter="active">处理中 <span class="count" id="c-active">0</span></button>
      <button class="tab" data-filter="done">已完成 <span class="count" id="c-done">0</span></button>
      <button class="tab" data-filter="failed">失败 <span class="count" id="c-failed">0</span></button>
    </nav>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" placeholder="搜索文件名">
    </label>
    <button class="pill-btn" id="btn-theme" title="外观"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg><span>外观</span></button>
    <button class="icon-btn" id="btn-bg" title="更换背景图（右键恢复默认）"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg></button>
    <button class="icon-btn" id="btn-resume-all" title="继续全部暂停的任务"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  </header>

  <main class="main">
    <!-- 左：任务列表 -->
    <section class="panel glass list-panel">
      <div class="panel-head">
        <h2 id="list-title">全部任务</h2><span class="muted" id="list-count">0 个</span>
        <div class="spacer"></div>
        <button class="text-btn" id="btn-clear">清除已完成</button>
      </div>
      <div class="job-list" id="job-list"></div>
      <div class="empty" id="empty">
        <div class="empty-ring"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
        <div class="empty-title">拖入视频开始超分</div>
        <div class="muted">支持 mp4 / mov / mkv，可一次拖入多个或整个文件夹</div>
      </div>
    </section>

    <!-- 右：设置 -->
    <aside class="panel glass side">
      <h2>开始超分</h2>

      <div class="field">
        <div class="label">视频 <span class="muted" id="pick-count"></span></div>
        <div class="dropzone" id="dropzone">
          <div class="dz-empty" id="dz-empty">
            <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span>拖入视频，或<b>点击选择</b></span>
          </div>
          <div class="dz-list" id="dz-list"></div>
        </div>
      </div>

      <div class="field">
        <div class="label">超分模式</div>
        <div class="seg" id="seg-model"></div>
        <div class="hint" id="model-note"></div>
      </div>

      <div class="field" id="field-strength">
        <div class="label">AI 细节强度 <span class="val" id="v-strength"></span></div>
        <input type="range" id="r-strength" min="0" max="1" step="0.05">
        <div class="scale-hint"><span>原画质感</span><span>AI 锐利</span></div>
      </div>

      <div class="row2">
        <div class="field">
          <div class="label">输出分辨率</div>
          <div class="seg" id="seg-target">
            <button data-v="1080p">1080P</button><button data-v="2k">2K</button>
          </div>
        </div>
        <div class="field">
          <div class="label">画质</div>
          <div class="seg" id="seg-quality">
            <button data-v="standard">标准</button><button data-v="high">高码率</button>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="label">调色</div>
        <div class="seg seg4" id="seg-preset"></div>
        <div class="hint" id="preset-note"></div>
      </div>

      <div class="row2">
        <div class="field">
          <div class="label">调色强度 <span class="val" id="v-pstrength"></span></div>
          <input type="range" id="r-pstrength" min="0" max="1.5" step="0.05">
        </div>
        <div class="field">
          <div class="label">胶片颗粒 <span class="val" id="v-grain"></span></div>
          <input type="range" id="r-grain" min="0" max="1" step="0.05">
        </div>
      </div>

      <div class="field">
        <div class="label">输出位置</div>
        <button class="out-btn" id="btn-out"><span id="out-text">与原视频相同目录</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>

      <div class="actions">
        <button class="ghost-btn" id="btn-preview">预览效果</button>
        <button class="primary-btn" id="btn-start">开 始 超 分</button>
      </div>

      <div class="recent">
        <div class="recent-head">最近完成</div>
        <div id="recent-list"></div>
      </div>
      <div class="env" id="env"></div>
    </aside>
  </main>
</div>

<!-- 预览对比 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card glass">
    <div class="modal-head">
      <h2>效果预览</h2>
      <span class="muted" id="pv-meta"></span>
      <div class="spacer"></div>
      <div class="seg small" id="seg-zoom"><button data-v="fit" class="on">适应窗口</button><button data-v="1">100%</button></div>
      <button class="icon-btn" id="pv-close" title="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="compare" id="compare">
      <div class="cmp-inner" id="cmp-inner">
        <img id="pv-after" alt="">
        <div class="cmp-before" id="cmp-before"><img id="pv-before" alt=""></div>
        <div class="cmp-handle" id="cmp-handle"><span></span></div>
        <div class="cmp-tag left">原片放大</div><div class="cmp-tag right">超分成片</div>
      </div>
      <div class="pv-loading" id="pv-loading"><div class="spinner"></div><div id="pv-loading-text">正在渲染预览…</div></div>
    </div>
    <div class="modal-foot">
      <span class="label">画面位置</span>
      <input type="range" id="pv-time" min="0" max="10" step="0.1" value="5">
      <span class="val" id="pv-time-v">5.0s</span>
      <select id="pv-file"></select>
      <button class="ghost-btn" id="pv-render">重新渲染</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
